<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wedding Invitation — Wax Seal Transition Sandbox</title>
  <style>
    :root {
      --wax: #8d1628;
      --wax-dark: #5f0c1a;
      --wax-light: #c94c59;
      --gold: #b68a3d;
      --ease-ceremonial: cubic-bezier(.22,.76,.22,1);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
    }

    body {
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
    }

    .stage {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(177.7778vw, 100vh);
      overflow: hidden;
      isolation: isolate;
      background: #fff;
    }

    .landing-page {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #fff;
    }

    .landing-page iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .hero-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .08)),
        url("work-1-backdrop.png") center / cover no-repeat;
      clip-path: circle(150% at 50% 50%);
      transition:
        clip-path 1.45s var(--ease-ceremonial) .18s,
        opacity .9s ease .48s;
    }

    .hero-layer::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .18;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 250, 236, .42), transparent 30%),
        radial-gradient(circle at 50% 52%, rgba(108, 67, 22, .08), transparent 46%);
      pointer-events: none;
    }

    .botanical-sway {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: url("work-1-backdrop.png") center / cover no-repeat;
      transform-origin: top center;
      will-change: transform;
      opacity: .36;
      mix-blend-mode: normal;
      animation: botanicalBreeze 9.5s ease-in-out infinite alternate;
    }

    .botanical-sway.top-canopy {
      clip-path: polygon(0 0, 100% 0, 100% 31%, 84% 25%, 70% 16%, 53% 20%, 37% 15%, 18% 27%, 0 34%);
      animation-duration: 11.8s;
      animation-delay: -2.3s;
      opacity: .28;
    }

    .botanical-sway.left-hang {
      clip-path: polygon(0 0, 35% 0, 27% 18%, 24% 35%, 30% 56%, 22% 70%, 0 72%);
      animation-name: botanicalBreezeLeft;
      animation-duration: 10.7s;
      animation-delay: -4.6s;
      opacity: .28;
    }

    .botanical-sway.right-hang {
      clip-path: polygon(66% 0, 100% 0, 100% 72%, 78% 70%, 72% 56%, 80% 36%, 74% 17%);
      animation-name: botanicalBreezeRight;
      animation-duration: 12.4s;
      animation-delay: -1.1s;
      opacity: .28;
    }

    @keyframes botanicalBreeze {
      0% { transform: rotate(-.42deg) translate3d(-.16%, 0, 0); }
      50% { transform: rotate(.18deg) translate3d(.05%, .08%, 0); }
      100% { transform: rotate(.48deg) translate3d(.18%, 0, 0); }
    }

    @keyframes botanicalBreezeLeft {
      0% { transform: rotate(.34deg) translate3d(.08%, 0, 0); }
      45% { transform: rotate(-.18deg) translate3d(-.06%, .06%, 0); }
      100% { transform: rotate(-.52deg) translate3d(-.18%, 0, 0); }
    }

    @keyframes botanicalBreezeRight {
      0% { transform: rotate(-.3deg) translate3d(-.08%, 0, 0); }
      55% { transform: rotate(.15deg) translate3d(.05%, .05%, 0); }
      100% { transform: rotate(.5deg) translate3d(.18%, 0, 0); }
    }

    .seal {
      position: relative;
      z-index: 3;
      width: 27%;
      aspect-ratio: 1;
      border: 0;
      padding: 0;
      cursor: pointer;
      background: transparent;
      filter:
        drop-shadow(0 20px 24px rgba(61, 20, 8, .22))
        drop-shadow(0 6px 7px rgba(63, 8, 18, .25));
      transform: scale(1);
      transition:
        transform .52s var(--ease-ceremonial),
        opacity .7s ease .52s,
        filter .7s ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .seal:focus-visible {
      outline: 2px solid rgba(182, 138, 61, .55);
      outline-offset: 10px;
      border-radius: 50%;
    }

    .wax-half {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 48% 52% 46% 54% / 52% 45% 55% 48%;
      background:
        radial-gradient(circle at 35% 28%, var(--wax-light) 0 8%, transparent 30%),
        radial-gradient(circle at 52% 52%, #a31c31, var(--wax) 62%, var(--wax-dark));
      box-shadow:
        inset 0 0 0 3px rgba(255, 196, 171, .12),
        inset -5px -8px 13px rgba(68, 3, 15, .27),
        inset 5px 6px 14px rgba(255, 186, 164, .1);
      transition:
        transform .82s cubic-bezier(.4,0,.7,1),
        opacity .58s ease .32s;
    }

    .wax-half.left {
      clip-path: polygon(0 0, 56% 0, 47% 18%, 57% 35%, 44% 55%, 53% 72%, 43% 100%, 0 100%);
    }

    .wax-half.right {
      clip-path: polygon(54% 0, 100% 0, 100% 100%, 41% 100%, 52% 72%, 43% 55%, 56% 35%, 46% 18%);
    }

    .seal img {
      width: 63%;
      height: 63%;
      object-fit: cover;
      border-radius: 50%;
      filter: sepia(1) saturate(.35) brightness(1.85) contrast(1.5);
      mix-blend-mode: screen;
    }

    .seal::before {
      content: "";
      position: absolute;
      inset: -10%;
      z-index: -1;
      border-radius: 50%;
      opacity: 0;
      transform: scale(.75);
      background: radial-gradient(circle, rgba(182, 138, 61, .28), transparent 64%);
      transition: opacity .75s ease, transform 1.1s var(--ease-ceremonial);
    }

    .seal::after {
      content: "";
      position: absolute;
      inset: 17%;
      border: 1px solid rgba(255, 212, 180, .43);
      border-radius: 50%;
      pointer-events: none;
    }

    .crack {
      position: absolute;
      left: 50%;
      top: 14%;
      width: 2px;
      height: 72%;
      z-index: 4;
      opacity: 0;
      transform: translateX(-50%) scaleY(.25);
      transform-origin: center;
      background:
        linear-gradient(180deg, transparent 0 5%, rgba(255, 226, 197, .7) 5% 16%, transparent 16% 23%, rgba(74, 3, 15, .48) 23% 36%, transparent 36% 47%, rgba(255, 226, 197, .72) 47% 61%, transparent 61% 70%, rgba(74, 3, 15, .42) 70% 92%, transparent 92%);
      clip-path: polygon(50% 0, 100% 12%, 32% 25%, 76% 41%, 22% 58%, 68% 74%, 40% 100%, 0 84%, 45% 70%, 8% 52%, 58% 35%, 18% 18%);
      transition:
        opacity .28s ease,
        transform .52s cubic-bezier(.2,.8,.2,1);
      pointer-events: none;
    }

    .stage.open .seal {
      transform: scale(1.1);
      opacity: 0;
      filter:
        drop-shadow(0 26px 34px rgba(61, 20, 8, .14))
        drop-shadow(0 8px 10px rgba(63, 8, 18, .16));
    }

    .stage.open .seal::before {
      opacity: 1;
      transform: scale(1.55);
    }

    .stage.open .crack {
      opacity: 1;
      transform: translateX(-50%) scaleY(1);
    }

    .stage.open .wax-half.left {
      transform: translate(-34%, 9%) rotate(-13deg);
      opacity: 0;
    }

    .stage.open .wax-half.right {
      transform: translate(34%, 8%) rotate(14deg);
      opacity: 0;
    }

    .stage.open .hero-layer {
      clip-path: circle(0% at 50% 50%);
      opacity: 0;
    }

    .stage.revealed .hero-layer {
      display: none;
      visibility: hidden;
    }

    @media (prefers-reduced-motion: reduce) {
      .hero-layer,
      .seal,
      .wax-half,
      .crack,
      .seal::before {
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }

      .botanical-sway {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Wax seal transition sandbox">
    <section class="landing-page" aria-label="Invitation details">
      <iframe id="pageTwoFrame" src="2.html" title="Invitation details" loading="eager"></iframe>
    </section>

    <section class="hero-layer" aria-label="Tap the wax seal to reveal the blank canvas">
      <span class="botanical-sway top-canopy" aria-hidden="true"></span>
      <span class="botanical-sway left-hang" aria-hidden="true"></span>
      <span class="botanical-sway right-hang" aria-hidden="true"></span>
      <button class="seal" id="seal" type="button" aria-label="Open the invitation">
        <div class="wax-half left"><img src="ganesh.jpeg" alt=""></div>
        <div class="wax-half right"><img src="ganesh.jpeg" alt=""></div>
        <span class="crack" aria-hidden="true"></span>
      </button>
    </section>
  </main>

  <script>
    (() => {
      const stage = document.getElementById('stage');
      const seal = document.getElementById('seal');
      const heroLayer = document.querySelector('.hero-layer');
      const pageTwoFrame = document.getElementById('pageTwoFrame');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const startRevealed = new URLSearchParams(window.location.search).get('revealed') === '1';
      let completed = false;
      const interactiveSelector = 'a, button, input, textarea, select, label, audio, video, [role="button"], [contenteditable="true"]';

      const completeReveal = () => {
        if (completed) return;
        completed = true;
        stage.classList.add('revealed');
        window.dispatchEvent(new CustomEvent('invitation:wax-transition-complete'));
        window.parent?.postMessage({ type: 'invitation:wax-transition-complete' }, '*');
      };

      const openSeal = () => {
        if (stage.classList.contains('open')) return;
        stage.classList.add('open');
        seal.disabled = true;

        window.setTimeout(completeReveal, reducedMotion ? 50 : 1850);
      };

      heroLayer.addEventListener('transitionend', event => {
        if (event.propertyName === 'clip-path' || event.propertyName === '-webkit-clip-path') completeReveal();
      });

      const installPageTwoScrollBridge = () => {
        const doc = pageTwoFrame.contentDocument;
        if (!doc || !doc.documentElement || doc.location?.href === 'about:blank') return;
        if (pageTwoFrame.__scrollBridgeDocument === doc) return;
        pageTwoFrame.__scrollBridgeDocument = doc;

        doc.addEventListener('wheel', event => {
          const target = event.target?.nodeType === 1 ? event.target : event.target?.parentElement;
          if (target?.closest?.(interactiveSelector)) return;
          event.preventDefault();
          window.parent?.postMessage({ type: 'invitation:scroll-delta', delta: event.deltaY }, '*');
        }, { capture: true, passive: false });

        let startX = 0;
        let startY = 0;
        doc.addEventListener('touchstart', event => {
          startX = event.touches[0]?.clientX || 0;
          startY = event.touches[0]?.clientY || 0;
        }, { capture: true, passive: true });

        doc.addEventListener('touchmove', event => {
          const target = event.target?.nodeType === 1 ? event.target : event.target?.parentElement;
          if (target?.closest?.(interactiveSelector)) return;
          const currentX = event.touches[0]?.clientX || startX;
          const currentY = event.touches[0]?.clientY || startY;
          const dx = currentX - startX;
          const dy = startY - currentY;
          if (Math.abs(dy) > 34 && Math.abs(dy) > Math.abs(dx) * 1.15) {
            event.preventDefault();
            window.parent?.postMessage({ type: 'invitation:scroll-delta', delta: dy }, '*');
            startX = 0;
            startY = 0;
          }
        }, { capture: true, passive: false });
      };

      pageTwoFrame.addEventListener('load', installPageTwoScrollBridge);
      installPageTwoScrollBridge();
      window.setTimeout(installPageTwoScrollBridge, 300);
      window.setTimeout(installPageTwoScrollBridge, 1000);

      seal.addEventListener('click', openSeal);

      window.replayWaxSealTransition = () => {
        completed = false;
        stage.classList.remove('open');
        stage.classList.remove('revealed');
        seal.disabled = false;
        void stage.offsetWidth;
      };

      if (startRevealed) {
        completed = true;
        stage.classList.add('open', 'revealed');
        seal.disabled = true;
      }
    })();
  </script>
</body>
</html>
