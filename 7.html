<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page 7 — Blessing Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&amp;family=Great+Vibes&amp;family=Playfair+Display:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --ink: #342446;
      --violet: #7557a4;
      --royal-title: #6d4a94;
      --plum: #4a355f;
      --muted: rgba(56,42,71,.66);
      --cream: #fff8ef;
      --peach: #ffe3d4;
      --lavender: #f3d9ff;
      --blue: #d6e3ff;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #f2dfec;
      font-family: "Cormorant Garamond", serif;
    }

    .page {
      position: relative;
      width: min(100vw, 56.25vh);
      height: min(100vh, 177.7778vw);
      overflow: hidden;
      container-type: size;
      isolation: isolate;
      color: var(--ink);
      background:
        radial-gradient(circle at 78% 16%, rgba(255, 211, 128, .58), transparent 25%),
        radial-gradient(circle at 25% 88%, rgba(171, 155, 255, .52), transparent 32%),
        radial-gradient(circle at 20% 18%, rgba(255,255,255,.55), transparent 28%),
        linear-gradient(145deg, var(--peach) 0%, var(--lavender) 48%, var(--blue) 100%);
    }

    .page::before,
    .page::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .page::before {
      z-index: 8;
      inset: 4%;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,.6);
      box-shadow:
        inset 0 0 70px rgba(255,255,255,.24),
        0 0 0 1px rgba(127, 94, 155, .08);
    }

    .page::after {
      z-index: 1;
      right: -13cqw;
      top: 18cqh;
      width: 38cqw;
      height: 38cqw;
      border: 1px solid rgba(85, 76, 130, .22);
      border-radius: 999px;
      box-shadow:
        -58cqw 36cqh 0 -10cqw rgba(255,255,255,.18),
        -32cqw -4cqh 0 -13cqw rgba(255,255,255,.24),
        -17cqw 16cqh 0 -15cqw rgba(117,87,164,.11);
    }

    .stars {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .28;
      pointer-events: none;
      mix-blend-mode: soft-light;
    }

    .corner {
      position: absolute;
      z-index: 9;
      width: 15cqw;
      aspect-ratio: 1;
      border-color: rgba(117,87,164,.24);
      border-style: solid;
      pointer-events: none;
    }
    .tl { top: 4.6%; left: 4.6%; border-width: 1px 0 0 1px; }
    .tr { top: 4.6%; right: 4.6%; border-width: 1px 1px 0 0; }
    .bl { bottom: 4.6%; left: 4.6%; border-width: 0 0 1px 1px; }
    .br { bottom: 4.6%; right: 4.6%; border-width: 0 1px 1px 0; }

    .header {
      position: relative;
      z-index: 4;
      padding: 7.8cqh 7.2cqw 0;
      text-align: center;
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 1.1cqh;
      color: var(--violet);
      font: 500 1.15cqh/1 "Cinzel", serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--royal-title);
      font: 400 6.25cqh/.88 "Great Vibes", "Cormorant Garamond", cursive;
      letter-spacing: .015em;
      text-shadow:
        0 2px 0 rgba(255,255,255,.38),
        0 14px 30px rgba(109, 74, 148, .18);
    }

    .subcopy {
      width: 76%;
      margin: 1.1cqh auto 0;
      color: var(--muted);
      font: italic 500 1.45cqh/1.35 "Cormorant Garamond", serif;
      letter-spacing: .03em;
    }

    .board {
      position: absolute;
      z-index: 3;
      left: 0;
      right: 0;
      top: 25.5cqh;
      height: 42cqh;
      overflow: hidden;
      touch-action: pan-y;
      cursor: grab;
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0%, #000 10%, #000 90%, transparent 100%);
    }

    .board:active { cursor: grabbing; }

    .stream {
      position: absolute;
      top: 50%;
      left: 0;
      display: flex;
      align-items: stretch;
      gap: 4.3cqw;
      will-change: transform;
      transform: translate3d(0, -50%, 0);
    }

    .blessing-card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 50cqw;
      min-height: 20cqh;
      flex: 0 0 auto;
      padding: 2.2cqh 4.6cqw;
      border: 1px solid rgba(255,255,255,.64);
      border-radius: 22px;
      background: rgba(255,255,255,.18);
      box-shadow:
        0px 20px 40px rgba(83, 63, 120, .28),
        inset 0 1px 0 rgba(255,255,255,.72),
        inset 0 -1px 0 rgba(117,87,164,.08);
      transform: translateY(var(--lift, 0)) rotate(var(--tilt, 0deg));
    }

    .blessing-card::before {
      content: "";
      position: absolute;
      inset: -10px;
      z-index: -2;
      background: var(--card-img) center / cover no-repeat;
      filter: blur(.85px);
      transform: scale(1.06);
    }

    .blessing-card::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(145deg, rgba(255,248,239,.58), rgba(243,217,255,.25)),
        rgba(0, 0, 0, .35);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.62);
    }

    .blessing-card strong {
      display: block;
      margin-bottom: 1.1cqh;
      color: #fff1c7;
      font: 600 1.55cqh/1 "Cinzel", serif;
      letter-spacing: .12em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(38,24,52,.62);
    }

    .blessing-card p {
      margin: 0;
      color: rgba(255, 252, 247, .96);
      font: 500 2.05cqh/1.22 "Cormorant Garamond", serif;
      letter-spacing: .015em;
      text-shadow: 0 1px 10px rgba(38,24,52,.72);
    }

    .form-shell {
      position: absolute;
      z-index: 6;
      left: 6.8%;
      right: 6.8%;
      bottom: 7.2%;
      padding: 2.1cqh 4.5cqw 2.35cqh;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 24px;
      background: rgba(255,255,255,.38);
      box-shadow:
        0 18px 45px rgba(83,63,120,.18),
        inset 0 1px 0 rgba(255,255,255,.66);
      backdrop-filter: blur(14px);
    }

    .form-title {
      margin: 0 0 1.3cqh;
      color: var(--violet);
      font: 500 1.18cqh/1 "Cinzel", serif;
      letter-spacing: .24em;
      text-transform: uppercase;
      text-align: center;
    }

    .field-row {
      display: grid;
      gap: 1cqh;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(255,255,255,.58);
      border-radius: 16px;
      padding: 1.25cqh 3.4cqw;
      outline: none;
      color: var(--ink);
      background: rgba(255,255,255,.42);
      font: 500 1.45cqh/1.2 "Cormorant Garamond", serif;
      letter-spacing: .03em;
      box-shadow: inset 0 1px 10px rgba(83,63,120,.08);
    }

    textarea {
      min-height: 7.2cqh;
      resize: none;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(56,42,71,.42);
    }

    .submit {
      width: 100%;
      margin-top: 1.15cqh;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 999px;
      padding: 1.2cqh 4cqw;
      color: #342446;
      background: linear-gradient(135deg, #ffe3a5, #b7a7ff);
      font: 600 1.18cqh/1 "Cinzel", serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      box-shadow: 0 12px 28px rgba(83,63,120,.2);
    }

    .toast {
      position: absolute;
      z-index: 10;
      left: 50%;
      bottom: 26.5%;
      width: 78%;
      padding: 1.5cqh 4cqw;
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 18px;
      color: var(--ink);
      background: rgba(255,255,255,.74);
      box-shadow: 0 18px 36px rgba(83,63,120,.22);
      text-align: center;
      font: 500 1.35cqh/1.25 "Cormorant Garamond", serif;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease, transform .28s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .modal {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 7cqw;
      background: rgba(46, 31, 63, .28);
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .warning-card {
      width: 100%;
      padding: 3cqh 6cqw;
      border: 1px solid rgba(255,255,255,.72);
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(255,255,255,.94), rgba(246,229,255,.94));
      box-shadow: 0 24px 54px rgba(83,63,120,.3);
      text-align: center;
    }

    .warning-card h2 {
      margin: 0 0 1.2cqh;
      color: var(--violet);
      font: 600 2.25cqh/1.1 "Cinzel", serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .warning-card p {
      margin: 0 0 2cqh;
      color: rgba(56,42,71,.78);
      font: 500 1.65cqh/1.35 "Cormorant Garamond", serif;
    }

    .warning-card button {
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 999px;
      padding: 1.15cqh 8cqw;
      color: #342446;
      background: linear-gradient(135deg, #ffe3a5, #b7a7ff);
      font: 600 1.15cqh/1 "Cinzel", serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    @media (max-aspect-ratio: 9/16) {
      .page { width: 100vw; height: 177.7778vw; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="Floating blessing message board">
    <canvas class="stars" id="stars" aria-hidden="true"></canvas>
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

    <header class="header">
      <h1>Blessing Board</h1>
    </header>

    <section class="board" id="board" aria-label="Guest blessing stream">
      <div class="stream" id="stream"></div>
    </section>

    <form class="form-shell" id="blessingForm">
      <p class="form-title">Add a Blessing</p>
      <div class="field-row">
        <input id="guestName" name="guestName" maxlength="36" autocomplete="name" placeholder="Your name" required>
        <textarea id="guestBlessing" name="guestBlessing" maxlength="180" placeholder="Your blessings for Nayaab & Akanksha" required></textarea>
      </div>
      <button class="submit" type="submit">Send Blessing</button>
    </form>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="modal" id="warningModal" role="dialog" aria-modal="true" aria-labelledby="warningTitle">
      <div class="warning-card">
        <h2 id="warningTitle">Let’s keep it graceful</h2>
        <p>This message was not added because it contains wording that does not match the tone of the invite.</p>
        <button type="button" id="closeWarning">Try Again</button>
      </div>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('stars');
      const page = canvas.closest('.page');
      const context = canvas.getContext('2d', { alpha: true });
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const stars = [];
      let width = 0;
      let height = 0;
      let frameId = null;

      const createStar = () => {
        const kindRoll = Math.random();
        const kind = kindRoll > .9 ? 'hero' : kindRoll > .62 ? 'glint' : 'dust';
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          radius: kind === 'hero' ? Math.random() * 1.3 + 1.1 : kind === 'glint' ? Math.random() * .85 + .55 : Math.random() * .55 + .25,
          alpha: kind === 'hero' ? Math.random() * .45 + .5 : Math.random() * .38 + .18,
          speed: Math.random() * .0015 + .00045,
          phase: Math.random() * Math.PI * 2,
          kind
        };
      };

      const resizeStars = () => {
        const rect = page.getBoundingClientRect();
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = rect.width;
        height = rect.height;
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        stars.length = 0;
        const count = Math.floor(width * height / 5200);
        for (let index = 0; index < count; index += 1) stars.push(createStar());
      };

      const drawStars = time => {
        context.clearRect(0, 0, width, height);
        for (const star of stars) {
          const pulse = Math.min(1, star.alpha * (.58 + Math.sin(time * star.speed + star.phase) * .38 + .28));
          context.save();
          context.translate(star.x, star.y);
          context.fillStyle = `rgba(244, 217, 150, ${pulse})`;
          context.shadowColor = `rgba(244, 217, 150, ${pulse})`;
          context.shadowBlur = star.kind === 'hero' ? 12 : star.kind === 'glint' ? 6 : 2;
          context.beginPath();
          if (star.kind === 'glint' || star.kind === 'hero') {
            const long = star.kind === 'hero' ? 4.2 : 3;
            const short = star.kind === 'hero' ? .55 : .4;
            context.moveTo(0, -star.radius * long);
            context.lineTo(star.radius * short, -star.radius * short);
            context.lineTo(star.radius * long, 0);
            context.lineTo(star.radius * short, star.radius * short);
            context.lineTo(0, star.radius * long);
            context.lineTo(-star.radius * short, star.radius * short);
            context.lineTo(-star.radius * long, 0);
            context.lineTo(-star.radius * short, -star.radius * short);
          } else {
            context.arc(0, 0, star.radius, 0, Math.PI * 2);
          }
          context.fill();
          context.restore();
        }
        frameId = requestAnimationFrame(drawStars);
      };

      const startStars = () => {
        if (frameId) cancelAnimationFrame(frameId);
        resizeStars();
        if (!reduceMotion.matches) frameId = requestAnimationFrame(drawStars);
      };

      window.addEventListener('resize', startStars, { passive: true });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && frameId) cancelAnimationFrame(frameId);
        if (!document.hidden) startStars();
      });
      reduceMotion.addEventListener('change', startStars);
      startStars();

      const board = document.getElementById('board');
      const stream = document.getElementById('stream');
      const form = document.getElementById('blessingForm');
      const nameInput = document.getElementById('guestName');
      const blessingInput = document.getElementById('guestBlessing');
      const modal = document.getElementById('warningModal');
      const closeWarning = document.getElementById('closeWarning');
      const toast = document.getElementById('toast');

      const storageKey = 'nayaab-akanksha-blessing-board-v1';
      const blockedLogKey = 'nayaab-akanksha-blocked-blessings-v1';
      const defaults = [
        { name: 'The Sharma Family', text: 'May your home be full of laughter, patience, and a love that keeps choosing each other.' },
        { name: 'Loved Ones', text: 'Wishing you a lifetime of soft mornings, grand adventures, and endless blessings.' },
        { name: 'Friends Forever', text: 'May this new chapter be as joyful, elegant, and beautiful as the two of you.' },
        { name: 'With Blessings', text: 'May every step ahead be guided by grace, togetherness, and divine light.' },
        { name: 'Family', text: 'Here’s to a forever filled with warmth, celebration, and countless shared dreams.' }
      ];
      const storyImages = [
        'story/a.png',
        'story/b.jpeg',
        'story/c.png',
        'story/d.png',
        'story/e.jpeg',
        'story/f.jpeg'
      ];

      const blockedPatterns = [
        /fuck/i, /shit/i, /bitch/i, /bastard/i, /asshole/i, /dick/i, /pussy/i, /cunt/i,
        /sex/i, /porn/i, /nude/i, /slut/i, /whore/i, /kill/i, /hate/i, /damn/i
      ];

      const clean = value => value.replace(/\s+/g, ' ').trim();
      const loadMessages = () => {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
          return [...saved, ...defaults];
        } catch {
          return defaults;
        }
      };

      const renderMessages = () => {
        const messages = loadMessages();
        const repeated = [...messages, ...messages, ...messages];
        stream.innerHTML = repeated.map((message, index) => `
          <article class="blessing-card" style="--lift:${((index % 3) - 1) * 1.4}cqh; --tilt:${((index % 4) - 1.5) * .55}deg; --card-img:url('${storyImages[index % storyImages.length]}')">
            <strong>${escapeHtml(message.name)}</strong>
            <p>${escapeHtml(message.text)}</p>
          </article>
        `).join('');
      };

      const escapeHtml = value => value
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      const isFlagged = text => blockedPatterns.some(pattern => pattern.test(text));

      const fingerprint = async () => {
        const raw = [
          navigator.userAgent,
          navigator.language,
          screen.width,
          screen.height,
          screen.colorDepth,
          new Date().getTimezoneOffset(),
          navigator.hardwareConcurrency || '',
          navigator.platform || ''
        ].join('|');

        if (crypto?.subtle) {
          const data = new TextEncoder().encode(raw);
          const digest = await crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(digest)).map(byte => byte.toString(16).padStart(2, '0')).join('');
        }
        return btoa(raw).slice(0, 64);
      };

      const logBlocked = async (name, text) => {
        const existing = JSON.parse(localStorage.getItem(blockedLogKey) || '[]');
        existing.push({
          fingerprint: await fingerprint(),
          userAgent: navigator.userAgent,
          sessionId: getSessionId(),
          nameLength: name.length,
          textLength: text.length,
          createdAt: new Date().toISOString()
        });
        localStorage.setItem(blockedLogKey, JSON.stringify(existing.slice(-40)));
      };

      const getSessionId = () => {
        const key = 'nayaab-akanksha-device-session';
        let value = sessionStorage.getItem(key);
        if (!value) {
          value = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
          sessionStorage.setItem(key, value);
        }
        return value;
      };

      const showToast = message => {
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(showToast.timer);
        showToast.timer = window.setTimeout(() => toast.classList.remove('show'), 2400);
      };

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const name = clean(nameInput.value);
        const text = clean(blessingInput.value);
        if (!name || !text) return;

        if (isFlagged(`${name} ${text}`)) {
          await logBlocked(name, text);
          modal.classList.add('show');
          return;
        }

        const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
        saved.unshift({ name, text });
        localStorage.setItem(storageKey, JSON.stringify(saved.slice(0, 24)));
        nameInput.value = '';
        blessingInput.value = '';
        renderMessages();
        recalcLoop();
        showToast('Your blessing has joined the night sky.');
      });

      closeWarning.addEventListener('click', () => modal.classList.remove('show'));
      modal.addEventListener('click', event => {
        if (event.target === modal) modal.classList.remove('show');
      });

      let position = 0;
      let defaultSpeed = .032;
      let velocity = defaultSpeed;
      let loopWidth = 1;
      let lastTime = performance.now();
      let dragStartX = 0;
      let dragLastX = 0;
      let dragLastTime = 0;
      let dragging = false;

      const recalcLoop = () => {
        const cards = [...stream.children];
        const oneSet = Math.max(1, Math.floor(cards.length / 3));
        const first = cards[0];
        const marker = cards[oneSet];
        if (first && marker) loopWidth = Math.max(1, marker.offsetLeft - first.offsetLeft);
      };

      const animateStream = time => {
        const delta = Math.min(34, time - lastTime);
        lastTime = time;

        position -= velocity * delta;
        while (position <= -loopWidth) position += loopWidth;
        while (position > 0) position -= loopWidth;
        stream.style.transform = `translate3d(${position}px, -50%, 0)`;

        if (!dragging) velocity += (defaultSpeed - velocity) * .038;
        requestAnimationFrame(animateStream);
      };

      board.addEventListener('pointerdown', event => {
        dragging = true;
        dragStartX = event.clientX;
        dragLastX = event.clientX;
        dragLastTime = performance.now();
        board.setPointerCapture(event.pointerId);
      });

      board.addEventListener('pointermove', event => {
        if (!dragging) return;
        const now = performance.now();
        const dx = event.clientX - dragLastX;
        const dt = Math.max(8, now - dragLastTime);
        position += dx * .38;
        velocity = Math.max(-.55, Math.min(.55, -dx / dt * 4.2));
        dragLastX = event.clientX;
        dragLastTime = now;
      });

      const endDrag = event => {
        if (!dragging) return;
        dragging = false;
        const totalDx = event.clientX - dragStartX;
        if (Math.abs(totalDx) > 20) velocity += totalDx < 0 ? .16 : -.16;
        velocity = Math.max(-.62, Math.min(.62, velocity));
      };

      board.addEventListener('pointerup', endDrag);
      board.addEventListener('pointercancel', endDrag);

      renderMessages();
      requestAnimationFrame(() => {
        recalcLoop();
        requestAnimationFrame(animateStream);
      });
      window.addEventListener('resize', recalcLoop, { passive: true });
    })();
  </script>
</body>
</html>
