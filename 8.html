    .waveform {
      display: none;
    }

    h1,
    .rule {
      display: none;
    }

    .credits {
      padding-top: 35.5cqh;
    }

    .rsvp {
      margin-top: .85cqh;
      margin-bottom: 2.55cqh;
      transform: translateY(-2.65cqh);
    }

    .vedic-line {
      transform: translateY(-2.65cqh);
    }

    .message {
      width: 82%;
      font-size: 1.95cqh;
      line-height: 1.52;
    }

    .eyebrow {
      order: 4;
      margin: 2.65cqh 0 0;
      font: 400 3.1cqh/.9 "Pinyon Script", cursive;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(125, 78, 35, .86);
    }

    .family-line {
      margin-top: 2.55cqh;
      font: 400 2.65cqh/1.12 "Pinyon Script", cursive;
      letter-spacing: .08em;
      text-transform: none;
      color: rgba(73, 52, 29, .72);
    }

    .signature {
      margin-top: 2.45cqh;
    }

    .vedic-ornaments {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      color: rgba(128, 73, 34, .34);
    }

    .vedic-ornaments svg {
      position: absolute;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.1;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toran {
      top: 5.2%;
      left: 50%;
      width: 66cqw;
      height: 10cqh;
      transform: translateX(-50%);
      opacity: .72;
      color: rgba(143, 81, 36, .42);
    }

    .mandala {
      top: 23%;
      left: 50%;
      width: 48cqw;
      height: 48cqw;
      transform: translateX(-50%);
      opacity: .16;
      color: rgba(128, 73, 34, .45);
    }

    .diya {
      bottom: 18.2%;
      width: 16cqw;
      height: 8cqh;
      opacity: .56;
      color: rgba(137, 80, 36, .5);
    }

    .diya.left { left: 9%; }
    .diya.right { right: 9%; transform: scaleX(-1); }

    .kalash {
      bottom: 31.5%;
      left: 50%;
      width: 18cqw;
      height: 12cqh;
      transform: translateX(-50%);
      opacity: .18;
      color: rgba(126,72,34,.44);
    }

    .vedic-line {
      position: relative;
      z-index: 1;
      margin: 0 0 1.7cqh;
      color: rgba(126,72,34,.7);
      font: 500 1.65cqh/1.2 "Cormorant Garamond", serif;
      letter-spacing: .12em;
    }

    @keyframes wave {
      0%, 100% { height: 24%; }
      45% { height: 96%; }
    }

    @media (max-aspect-ratio: 9/16) {
      .page { width: 100vw; height: 177.7778vw; }
    }
  </style>
</head>
<body>
  <main class="page" id="page" aria-label="Final closing credits and family voice note">
    <div class="vedic-ornaments" aria-hidden="true">
      <svg class="toran" viewBox="0 0 240 64">
        <path d="M14 16h212M28 16c8 22 22 30 42 30s34-8 50-30c16 22 30 30 50 30s34-8 42-30"/>
        <path d="M46 16c0 12-4 20-11 27M194 16c0 12 4 20 11 27"/>
        <path d="M68 22c-6 7-6 15 0 22 6-7 6-15 0-22Zm52 0c-6 7-6 15 0 22 6-7 6-15 0-22Zm52 0c-6 7-6 15 0 22 6-7 6-15 0-22Z"/>
        <path d="M112 47c5 5 11 5 16 0M116 53h8"/>
      </svg>
      <svg class="mandala" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="46"/>
        <circle cx="60" cy="60" r="28"/>
        <path d="M60 12c8 14 8 24 0 34-8-10-8-20 0-34Zm0 62c8 10 8 20 0 34-8-14-8-24 0-34ZM12 60c14-8 24-8 34 0-10 8-20 8-34 0Zm62 0c10-8 20-8 34 0-14 8-24 8-34 0Z"/>
        <path d="M26 26c16 3 24 10 25 23-13-1-20-9-25-23Zm43 43c13 1 20 9 25 23-16-3-24-10-25-23Zm25-43c-3 16-10 24-23 25 1-13 9-20 23-25ZM51 69c-1 13-9 20-25 23 3-16 10-24 25-23Z"/>
        <path d="M52 61c3-9 11-12 19-8 3 8-1 16-11 18-6-1-9-4-8-10Z"/>
      </svg>
      <svg class="kalash" viewBox="0 0 80 100">
        <path d="M24 36h32M29 36c-7 8-9 18-6 31 3 14 11 21 17 21s14-7 17-21c3-13 1-23-6-31"/>
        <path d="M30 88h20M34 36c-6-9-4-17 6-24 10 7 12 15 6 24"/>
        <path d="M40 12c-10 3-17 0-24-8 12-1 20 2 24 8Zm0 0c10 3 17 0 24-8-12-1-20 2-24 8Z"/>
        <path d="M25 58h30M28 70h24"/>
      </svg>
      <svg class="diya left" viewBox="0 0 100 56">
        <path d="M13 31c18 16 56 16 74 0-4 17-18 24-37 24S17 48 13 31Z"/>
        <path d="M21 31c8 7 50 7 58 0"/>
        <path d="M50 27c-8-8-6-17 1-26 10 11 12 20-1 26Z"/>
        <path d="M34 44h32"/>
      </svg>
      <svg class="diya right" viewBox="0 0 100 56">
        <path d="M13 31c18 16 56 16 74 0-4 17-18 24-37 24S17 48 13 31Z"/>
        <path d="M21 31c8 7 50 7 58 0"/>
        <path d="M50 27c-8-8-6-17 1-26 10 11 12 20-1 26Z"/>
        <path d="M34 44h32"/>
      </svg>
    </div>
    <section class="credits">
      <p class="vedic-line">॥ शुभम् भवतु ॥</p>
      <p class="rsvp">RSVP</p>
      <p class="message">Your love and blessings mean the world to us as we begin this beautiful new journey.</p>
      <p class="family-line">Parents · Grandparents · Family</p>
      <p class="signature">A final little note from Kriv and Eha
        <span class="audio-panel" id="audioPanel" aria-label="Family voice note player">
          <button class="play-toggle" id="playToggle" type="button" aria-label="Play voice note">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l9.3-6.8c.6-.4.6-1.2 0-1.6L9.6 4.4C8.9 3.9 8 4.4 8 5.2Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5c0-.55.45-1 1-1h2.1c.55 0 1 .45 1 1v13c0 .55-.45 1-1 1H8c-.55 0-1-.45-1-1v-13Zm5.9 0c0-.55.45-1 1-1H16c.55 0 1 .45 1 1v13c0 .55-.45 1-1 1h-2.1c-.55 0-1-.45-1-1v-13Z"/></svg>
          </button>
          <span class="audio-note" id="audioNote" aria-hidden="true"></span>
        </span>
      </p>
    </section>

    <section hidden>
      <audio id="voiceNote" preload="auto" src="audio_placeholder.mp3"></audio>
    </section>
  </main>

  <script>
    (() => {
      const page = document.getElementById('page');
      const audio = document.getElementById('voiceNote');
      const panel = document.getElementById('audioPanel');
      const button = document.getElementById('playToggle');
      const note = document.getElementById('audioNote');
      let attemptedCanvasStart = false;
      let fallbackContext = null;
      let fallbackTimer = null;

      const setPlaying = value => {
        panel.classList.toggle('playing', value);
        button.setAttribute('aria-label', value ? 'Pause voice note' : 'Play voice note');
        note.textContent = value ? 'Playing…' : '';
      };

      const playFallbackChime = () => {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const Context = window.AudioContext || window.webkitAudioContext;
        fallbackContext = fallbackContext || new Context();
        const now = fallbackContext.currentTime;
        const gain = fallbackContext.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.18, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
        gain.connect(fallbackContext.destination);
        [392, 523.25, 659.25].forEach((frequency, index) => {
          const oscillator = fallbackContext.createOscillator();
          oscillator.type = 'sine';
          oscillator.frequency.setValueAtTime(frequency, now + index * 0.08);
          oscillator.connect(gain);
          oscillator.start(now + index * 0.08);
          oscillator.stop(now + 2.65);
        });
        setPlaying(true);
        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(() => setPlaying(false), 2700);
        note.textContent = '';
      };

      const playAudio = async () => {
        try {
          clearTimeout(fallbackTimer);
          await audio.play();
          setPlaying(true);
        } catch {
          playFallbackChime();
        }
      };

      const pauseAudio = () => {
        audio.pause();
        clearTimeout(fallbackTimer);
        setPlaying(false);
      };

      button.addEventListener('click', event => {
        event.stopPropagation();
        if (panel.classList.contains('playing')) pauseAudio();
        else playAudio();
      });
      ['pointerdown', 'touchstart'].forEach(type => {
        button.addEventListener(type, event => event.stopPropagation(), { passive: true });
        panel.addEventListener(type, event => event.stopPropagation(), { passive: true });
      });

      page.addEventListener('pointerdown', () => {
        if (attemptedCanvasStart) return;
        attemptedCanvasStart = true;
        playAudio();
      }, { once: true });

      audio.addEventListener('play', () => setPlaying(true));
      audio.addEventListener('pause', () => setPlaying(false));
      audio.addEventListener('ended', () => setPlaying(false));
      audio.addEventListener('error', () => {
        if (audio.currentTime === 0) note.textContent = '';
      });
    })();
  </script>
</body>
